# ============================================================
# s1lk08.com — clean URL routing for Nginx
# ============================================================
#
# WHAT THIS DOES
# Maps pretty URLs to the real .html files on disk, and 301
# redirects the old .html URLs to the new clean ones so nothing
# breaks for old links/bookmarks/search results.
#
#   /              -> index.html
#   /home          -> index.html
#   /games         -> games.html
#   /socials       -> socials.html
#   /thumbnails    -> thumbnails.html
#   /404           -> 404.html   (also used automatically for real 404s)
#
# HOW TO INSTALL
# 1. SSH into your Lightsail instance.
# 2. Find your site's server block. It's usually one of:
#      /etc/nginx/sites-available/s1lk08.com
#      /etc/nginx/sites-available/default
#      /opt/bitnami/nginx/conf/... (if this is a Bitnami blueprint)
#    Open it with: sudo nano /etc/nginx/sites-available/s1lk08.com
# 3. Paste everything below (from "# --- clean URLs start ---" to
#    "# --- clean URLs end ---") INSIDE the existing
#    "server { ... }" block for s1lk08.com — anywhere between the
#    curly braces is fine, just not inside another location block.
# 4. Test the config, then reload:
#      sudo nginx -t
#      sudo systemctl reload nginx
# 5. Visit https://s1lk08.com/home in a browser to confirm.
#
# NOTE: this snippet doesn't touch listen/server_name/ssl/root —
# your existing server block already has those.
# ============================================================

# --- clean URLs start ---

location = / {
    try_files /index.html =404;
}

location = /home {
    try_files /index.html =404;
}

location = /games {
    try_files /games.html =404;
}

location = /socials {
    try_files /socials.html =404;
}

location = /thumbnails {
    try_files /thumbnails.html =404;
}

location = /404 {
    try_files /404.html =404;
}

# Redirect the old .html URLs to the new clean ones (301 = permanent)
location = /index.html {
    return 301 /home;
}

location = /games.html {
    return 301 /games;
}

location = /socials.html {
    return 301 /socials;
}

location = /thumbnails.html {
    return 301 /thumbnails;
}

# Use the site's own 404 page for real 404s too
error_page 404 /404.html;
location = /404.html {
    internal;
}

# --- clean URLs end ---
